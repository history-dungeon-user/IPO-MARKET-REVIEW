<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a1030" />
<title>SKYWARD — Infinite Ascent</title>

<style>
  :root {
    --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    --gold: #ffd98a;
    --cream: #fff4e0;
    --ink: #241636;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #150c28; color: var(--cream);
    font-family: var(--ui-font);
    touch-action: none; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; touch-action: none; }
  /* touch-action:none stops the browser hijacking taps as gestures (which would
     cancel the pointer stream and make input "freeze") */
  canvas { display: block; width: 100%; height: 100%; touch-action: none; -webkit-touch-callout: none; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    display: flex; flex-direction: column; align-items: center;
    opacity: 0; transition: opacity .5s ease;
  }
  #hud.playing { opacity: 1; }

  .score-wrap { margin-top: 4px; text-align: center; filter: drop-shadow(0 4px 12px rgba(0,0,0,.45)); }
  #score { font-size: clamp(48px, 15vw, 92px); font-weight: 800; line-height: .95;
    letter-spacing: -.02em; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.12); }
  #score.pop { animation: pop .28s cubic-bezier(.2,1.6,.3,1); }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.22)} 100%{transform:scale(1)} }
  .best-line { font-size: 13px; font-weight: 700; letter-spacing:.14em; text-transform: uppercase;
    color: rgba(255,244,224,.75); margin-top: 6px; }

  /* stamina bar */
  .stamina { width: min(62%, 340px); height: 12px; margin-top: 16px; border-radius: 99px;
    background: rgba(20,10,35,.38); box-shadow: inset 0 1px 3px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.06);
    overflow: hidden; backdrop-filter: blur(2px); }
  .stamina > i { display:block; height:100%; width:100%; border-radius:99px; transform-origin:left;
    background: linear-gradient(90deg,#7bffcf,#ffe08a 60%,#ff9d7a);
    box-shadow: 0 0 14px rgba(255,224,138,.6); transition: background .3s; }
  .stamina.low > i { background: linear-gradient(90deg,#ff6b6b,#ff9d5c); box-shadow:0 0 16px rgba(255,90,90,.7); }

  /* metronome beat pulse under the stamina bar */
  #beat { width:13px; height:13px; border-radius:50%; margin-top:13px;
    background: rgba(255,244,224,.22); box-shadow: 0 0 0 2px rgba(255,244,224,.16); }
  #beat.pulse { animation: beatpulse .5s ease-out; }
  @keyframes beatpulse {
    0% { transform: scale(2.0); background: var(--gold); box-shadow: 0 0 16px rgba(255,217,138,.9); }
    100% { transform: scale(1); background: rgba(255,244,224,.22); box-shadow: 0 0 0 2px rgba(255,244,224,.16); } }
  #beat.groove.pulse { animation: beatpulseG .5s ease-out; }
  @keyframes beatpulseG {
    0% { transform: scale(2.2); background:#7bffcf; box-shadow:0 0 20px rgba(123,255,207,.9); }
    100% { transform: scale(1); background: rgba(255,244,224,.22); box-shadow: 0 0 0 2px rgba(255,244,224,.16); } }

  /* on-beat judgement call-out near the character */
  #judge { position: fixed; left:50%; top:55%; transform: translate(-50%,-50%);
    pointer-events:none; font-size: clamp(17px,4.8vw,26px); font-weight:900;
    letter-spacing:.06em; opacity:0; }
  #judge.perfect { color:#8fffd6; text-shadow:0 2px 12px rgba(0,0,0,.5), 0 0 18px rgba(123,255,207,.6); }
  #judge.good { color: var(--gold); text-shadow:0 2px 12px rgba(0,0,0,.5); }
  #judge.show { animation: judgepop .5s ease-out; }
  @keyframes judgepop {
    0% { opacity:0; transform: translate(-50%,-40%) scale(.7); }
    25% { opacity:1; transform: translate(-50%,-54%) scale(1.06); }
    100% { opacity:0; transform: translate(-50%,-72%) scale(1); } }

  #combo { position: fixed; left:50%; top: 40%; transform: translate(-50%,-50%) scale(.6);
    font-size: clamp(26px,7vw,46px); font-weight:900; letter-spacing:.02em; opacity:0;
    color: var(--gold); text-shadow: 0 3px 18px rgba(0,0,0,.5); pointer-events:none; }
  #combo.show { animation: combo .6s ease-out; }
  @keyframes combo { 0%{opacity:0; transform:translate(-50%,-50%) scale(.5) rotate(-6deg)}
    30%{opacity:1; transform:translate(-50%,-58%) scale(1.05) rotate(-2deg)}
    100%{opacity:0; transform:translate(-50%,-74%) scale(1) rotate(0)} }

  /* touch hint chevrons on first play */
  .touchzones { position: fixed; inset:0; display:flex; pointer-events:none; }
  .touchzones > div { flex:1; display:flex; align-items:center; justify-content:center; }
  .chev { font-size: 44px; opacity:0; color: rgba(255,244,224,.5); }
  .hint .chev.l { animation: tapL 1.6s ease-in-out infinite; }
  .hint .chev.r { animation: tapR 1.6s ease-in-out infinite; }
  @keyframes tapL { 0%,100%{opacity:.15; transform:translateX(6px)} 50%{opacity:.7; transform:translateX(-4px)} }
  @keyframes tapR { 0%,100%{opacity:.15; transform:translateX(-6px)} 50%{opacity:.7; transform:translateX(4px)} }

  /* ---------- Overlays ---------- */
  .overlay { position: fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding: 6vh 24px; pointer-events:auto; z-index: 5;
    transition: opacity .6s ease, transform .6s ease; }
  .overlay.hidden { opacity:0; pointer-events:none; transform: translateY(-8px); }

  .logo { position: relative; font-size: clamp(46px, 15vw, 108px); font-weight: 900; letter-spacing:.06em;
    line-height:.92; color:#fff;
    background: linear-gradient(180deg,#fff 0%, #ffe6b0 55%, #ff9d68 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 1.2px rgba(80,40,70,.28);
    filter: drop-shadow(0 3px 1px rgba(74,38,64,.35)) drop-shadow(0 18px 34px rgba(60,25,50,.5)); }
  .tagline { margin-top: 10px; font-size: clamp(13px,3.6vw,17px); font-weight:600;
    letter-spacing:.34em; text-transform: uppercase; color: rgba(255,244,224,.72); }

  .btn { margin-top: 42px; pointer-events:auto; cursor:pointer;
    font-size: clamp(17px,4.6vw,20px); font-weight: 800; letter-spacing:.04em;
    color: var(--ink); padding: 17px 46px; border-radius: 99px; border: none;
    background: linear-gradient(180deg,#fff8ec,#ffd98a);
    box-shadow: 0 10px 30px rgba(255,190,120,.35), inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 rgba(180,120,60,.4);
    transition: transform .15s cubic-bezier(.2,1.6,.3,1), box-shadow .15s; }
  .btn:active { transform: translateY(3px) scale(.97); box-shadow: 0 4px 14px rgba(255,190,120,.35); }
  .btn.ghost { background: rgba(255,255,255,.08); color: var(--cream);
    box-shadow: inset 0 0 0 1.5px rgba(255,244,224,.35); }

  .go-title { font-size: clamp(30px,9vw,58px); font-weight:900; color:#fff; letter-spacing:.02em;
    text-shadow:0 8px 30px rgba(0,0,0,.5); }
  .go-stats { margin-top: 24px; display:flex; gap: 40px; }
  .stat { text-align:center; }
  .stat .k { font-size: 12px; letter-spacing:.22em; text-transform:uppercase; color: rgba(255,244,224,.6); font-weight:700; }
  .stat .v { font-size: clamp(38px,10vw,58px); font-weight:900; color:#fff; line-height:1; margin-top:4px; }
  .stat .v.gold { color: var(--gold); }
  .newbest { margin-top: 14px; font-size:14px; font-weight:800; letter-spacing:.18em;
    text-transform:uppercase; color: var(--gold); opacity:0; }
  .newbest.show { opacity:1; animation: shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.5)} }

  .menu-hint { position: fixed; left:0; right:0; bottom: max(26px, env(safe-area-inset-bottom));
    text-align:center; font-size:12px; font-weight:600; letter-spacing:.1em;
    color: rgba(255,244,224,.55); pointer-events:none;
    text-shadow: 0 1px 8px rgba(60,25,50,.4); }
  .credit { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left:0; right:0;
    text-align:center; font-size: 11px; letter-spacing:.18em; text-transform:uppercase;
    color: rgba(255,244,224,.35); pointer-events:none; }

  #loader { position: fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#150c28; z-index: 20; transition: opacity .6s; }
  #loader .ring { width:46px; height:46px; border-radius:50%;
    border:3px solid rgba(255,244,224,.2); border-top-color: var(--gold); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader.hidden { opacity:0; pointer-events:none; }

  .flash { position: fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index: 8; }
</style>

<div id="app"></div>

<div id="hud">
  <div class="score-wrap">
    <div id="score">0</div>
    <div class="best-line">BEST <span id="best">0</span></div>
  </div>
  <div class="stamina" id="stamina"><i id="staminaFill"></i></div>
  <div id="beat"></div>
</div>

<div id="combo"></div>
<div id="judge"></div>
<div class="flash" id="flash"></div>

<div class="touchzones" id="touchzones">
  <div><span class="chev l">‹</span></div>
  <div><span class="chev r">›</span></div>
</div>

<!-- Start -->
<div class="overlay" id="startScreen">
  <div class="logo">SKYWARD</div>
  <div class="tagline">Infinite Ascent</div>
  <button class="btn" id="playBtn">TAP TO CLIMB</button>
  <div class="menu-hint">좌·우 화면을 탭해 오르세요 · Tap left / right to climb</div>
</div>

<!-- Game Over -->
<div class="overlay hidden" id="overScreen">
  <div class="go-title">The Climb Rests</div>
  <div class="go-stats">
    <div class="stat"><div class="k">Steps</div><div class="v" id="finalScore">0</div></div>
    <div class="stat"><div class="k">Best</div><div class="v gold" id="finalBest">0</div></div>
  </div>
  <div class="newbest" id="newBest">★ New Record ★</div>
  <button class="btn" id="retryBtn">CLIMB AGAIN</button>
</div>

<div id="loader"><div class="ring"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
