<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPO 시장 동향</title>
<style>
  :root{--navy:#1F3864;--sub:#D9E1F2;--line:#D6DCE5;--muted:#6B7280;--bg:#F4F6FA;--red:#9A3B3B;
        --tblh:min(58vh,560px);}   /* 표 1개의 최대 높이 (넘으면 표 안에서 스크롤) */
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:#1a1a1a;
       font-family:"맑은 고딕","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.5;}
  /* 표가 많아 가로 스크롤이 잦으므로, 넓은 화면에선 폭을 최대한 넓게 쓴다.
     (기존 1180px 고정 → 화면의 96%까지, 다만 너무 넓어 가독성이 떨어지지 않게 상한 2200px) */
  .wrap{width:96%;max-width:2200px;margin:0 auto;padding:22px 18px 60px;}
  h1{font-size:22px;margin:0 0 4px;color:var(--navy);}
  .asof{color:var(--muted);font-size:12.5px;margin-bottom:16px;}
  .tabs{display:flex;gap:6px;border-bottom:2px solid var(--navy);margin-bottom:2px;flex-wrap:wrap;}
  .tabs button{border:1px solid var(--line);border-bottom:none;background:#fff;color:var(--muted);
      padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0;}
  .tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .pane{display:none;background:#fff;border:1px solid var(--line);border-top:none;
        padding:18px 16px 24px;border-radius:0 0 10px 10px;}
  .pane.active{display:block;}
  .sec{font-weight:700;color:var(--navy);margin:18px 0 8px;font-size:15px;}
  .sec:first-child{margin-top:4px;}
  .cnt{color:var(--muted);font-weight:600;font-size:13px;}
  .note{color:var(--muted);font-size:12px;margin-top:6px;}
  .search{margin:2px 0 10px;}
  .search input{width:260px;max-width:70%;padding:8px 12px;border:1px solid var(--line);
      border-radius:8px;font-size:14px;}
  /* 표 크기 제한 + 제목행 고정
     · 표 안에 커서를 두고 스크롤 → 표 내용만 움직이고 제목행은 붙어 있음
     · 표 밖에서 스크롤        → 페이지 전체가 움직임
     행이 몇 개 없으면 그 높이만큼만 차지하고, 많아지면 이 높이에서 멈추고 내부 스크롤. */
  .tblwrap{max-height:var(--tblh);overflow:auto;border:1px solid var(--line);
      border-radius:8px;}
  .tblwrap.tall{--tblh:78vh;}          /* 행이 아주 많은 표(예심·상장완료)용 */
  table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;}
  thead th{background:var(--navy);color:#fff;font-weight:600;padding:9px 10px;text-align:center;
      position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 rgba(255,255,255,.20);}
  tbody td{padding:8px 10px;border-top:1px solid #EEF1F6;text-align:center;}
  tbody tr:nth-child(even){background:#FafBfD;}
  tbody tr:hover{background:#EEF3FB;}
  /* 회사명(첫 열) 좌측 고정 — 옆으로 스크롤해도 회사명은 붙어 있게.
     opts.freeze 를 준 표에서만 켠다(.tblwrap.frz). 세로 스크롤 시 제목행과 겹치는
     좌상단 칸은 z-index 를 더 높여 헤더가 위에 오도록. */
  .tblwrap.frz table{position:relative;}
  .tblwrap.frz thead th:first-child{left:0;z-index:3;}
  .tblwrap.frz tbody td:first-child{position:sticky;left:0;z-index:1;
      background:#fff;box-shadow:inset -1px 0 0 var(--line);}
  .tblwrap.frz tbody tr:nth-child(even) td:first-child{background:#F4F7FB;}
  .tblwrap.frz tbody tr:hover td:first-child{background:#EEF3FB;}
  /* 스크롤바를 얇게 — 표가 스크롤 가능하다는 신호도 됨 */
  .tblwrap::-webkit-scrollbar{width:10px;height:10px;}
  .tblwrap::-webkit-scrollbar-thumb{background:#C7CDD6;border-radius:6px;
      border:2px solid #fff;}
  .tblwrap::-webkit-scrollbar-thumb:hover{background:#A8B1BD;}
  .tblwrap::-webkit-scrollbar-track{background:#F4F6FA;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  td.name{text-align:left;font-weight:600;}
  .dash{color:#C7CDD6;}
  .empty{color:var(--muted);padding:16px;}
  .totrow td{font-weight:700;background:#FCE4D6 !important;}
  .ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 14px;
        padding:10px 12px;background:#F7F9FC;border:1px solid var(--line);border-radius:9px;}
  .ctrl label{font-size:12.5px;color:var(--muted);font-weight:700;}
  .ctrl .ipt{padding:7px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;width:190px;}
  .ctrl .dt{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px;}
  .preset{border:1px solid var(--line);background:#fff;color:var(--muted);
          padding:6px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;}
  .preset:hover{background:var(--sub);}
  .btn-dl{margin-left:auto;border:1px solid var(--navy);background:var(--navy);color:#fff;
          padding:8px 15px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-dl:hover{opacity:.9;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .seg .segbtn{border:none;background:#fff;color:var(--muted);padding:8px 16px;
               font-size:13px;font-weight:700;cursor:pointer;}
  .seg .segbtn.active{background:var(--navy);color:#fff;}
  /* 심사 코멘트 탭 */
  .card{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:0 0 10px;background:#fff;}
  .card h4{margin:0 0 6px;font-size:14px;color:var(--navy);display:flex;align-items:center;gap:8px;}
  .card h4 .badge{background:var(--sub);color:var(--navy);font-size:11.5px;font-weight:700;
      padding:2px 7px;border-radius:10px;}
  .cmt{border-top:1px solid #EEF1F6;padding:9px 0 2px;}
  .cmt:first-of-type{border-top:none;}
  .cmt .meta{color:var(--muted);font-size:12px;margin-bottom:3px;}
  .cmt .txt{white-space:pre-wrap;font-size:13.5px;line-height:1.65;}
  .mask{position:fixed;inset:0;background:rgba(20,26,38,.45);display:flex;
      align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:12px;padding:20px 22px;width:min(540px,100%);
      max-height:90vh;overflow:auto;}
  .modal h3{margin:0 0 4px;font-size:16px;color:var(--navy);}
  .modal .hint{color:var(--muted);font-size:12px;margin:0 0 8px;}
  .modal label{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin:12px 0 4px;}
  .modal select,.modal input,.modal textarea{width:100%;padding:8px 10px;border:1px solid var(--line);
      border-radius:7px;font-size:13.5px;font-family:inherit;background:#fff;color:#1a1a1a;}
  .modal textarea{min-height:130px;resize:vertical;line-height:1.6;}
  .modal .act{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  .btn-pri{background:var(--navy);color:#fff;border:1px solid var(--navy);padding:8px 16px;
      border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-pri:disabled{opacity:.5;cursor:default;}
  .err{color:var(--red);font-size:13px;margin-top:8px;}
  .ok{color:#2E7D4F;font-size:13px;margin-top:8px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body><div class="wrap">
  <h1>IPO 시장 동향</h1>
  <div class="asof" id="asof"></div>
  <div class="tabs">
    <button data-t="t1" class="active">예심</button>

      <button class="btn-dl" id="dl1">⬇ 엑셀</button>
    </div>
    <div id="t1body"></div>
  </div>
  <div class="pane" id="t2">
    <div class="ctrl">
      <div class="seg">
        <button class="segbtn active" data-v="listed">상장 완료</button>

      </div>
      <span id="t2date">

        <button class="preset" data-tab="t2" data-p="all">전체</button>
        <button class="preset" data-tab="t2" data-p="year">올해</button>
        <button class="preset" data-tab="t2" data-p="q">최근3개월</button>
      </span>
      <button class="btn-dl" id="dl2">⬇ 엑셀</button>
    </div>
    <div id="t2body"></div>
  </div>
  <div class="pane" id="t3">
    <div class="ctrl">
      <label>기간(월)</label>
      <input type="date" id="t3from" class="dt"> ~ <input type="date" id="t3to" class="dt">
      <button class="preset" data-tab="t3" data-p="all">전체</button>
      <button class="preset" data-tab="t3" data-p="year">올해</button>
      <button class="preset" data-tab="t3" data-p="q">최근3개월</button>
      <button class="btn-dl" id="dl3">⬇ 엑셀</button>
    </div>
    <div id="t3body"></div>
  </div>
  <div class="pane" id="t6"><div id="t6body"></div></div>
  <div class="pane" id="t4">
    <div id="t4gate">
      <div class="sec">미승인 · 철회 사유 공유</div>
      <div class="note">거래소 미승인·철회 건의 배경과 사유를 팀이 함께 쌓는 공간입니다.
        내용은 <b>브라우저에서 암호화</b>되어 보관되므로, 비밀번호를 아는 사람만 읽을 수 있습니다.</div>
      <div class="ctrl" style="margin-top:12px">
        <input type="password" id="t4pw" class="ipt" placeholder="비밀번호" autocomplete="off">
        <button class="btn-pri" id="t4go">열기</button>
      </div>
      <div id="t4msg"></div>
    </div>
    <div id="t4body" style="display:none"></div>
  </div>
</div>

  h += cols.map(c=>`<th class="${c[2]?'num':''}">${c[1]}</th>`).join('');
  h += '</tr></thead><tbody>';
  if(!rows.length){
    h += `<tr><td class="empty" colspan="${cols.length}">해당 없음</td></tr>`;
  } else {
    for(const r of rows){
      const tot = opts.totalKey && r[opts.totalKey];
      h += tot ? '<tr class="totrow">' : '<tr>';
      h += cols.map((c,i)=>{
        const v = esc(r[c[0]]);
        const cls = (c[2]?'num':'') + (i===0 && !c[2] ? ' name':'');
        return `<td class="${cls}">${v===''?'<span class="dash">–</span>':v}</td>`;
      }).join('');
      h += '</tr>';
    }
  }
  return h + '</tbody></table></div>';
}

// 딜 목록 → 주관사 집계 (파이썬 _recalc_league 와 동일 규칙)
function aggLeague(deals){
  var agg={};
  deals.forEach(function(d){
    (d.인수인||[]).forEach(function(u){
      var a=agg[u.증권사]||(agg[u.증권사]={증권사:u.증권사,인수금액:0,인수수수료:0,청약수수료:0,전체수수료:0,건수:0});
      a.인수금액+=u.인수금액||0; a.인수수수료+=u.인수수수료||0;
      a.청약수수료+=u.청약수수료||0; a.전체수수료+=u.전체수수료||0;
    });
    (d.인수인||[]).forEach(function(u){
      if((u.역할==='대표'||u.역할==='공동대표') && agg[u.증권사]) agg[u.증권사].건수+=1;
    });
  });
  return Object.keys(agg).map(function(k){
    var a=agg[k];
    ['인수금액','인수수수료','청약수수료','전체수수료'].forEach(function(f){ a[f]=Math.round(a[f]*1000)/1000; });
    return a;
  });
}

/* ══════════════════════════════════════════════════════════════════
   탭4 · 심사 코멘트 (미승인·철회 사유 공유)

   보안 모델
     · 이 페이지는 인터넷에 공개돼 있다. 따라서 저장소(Google 시트)에 평문을 두면
       URL을 아는 누구나 읽을 수 있다.
     · 그래서 글은 '브라우저에서' 암호화한 뒤 보낸다. 시트에는 암호문만 쌓인다.
     · 비밀번호는 절대 전송되지 않는다. 잠그고 푸는 일이 각자 브라우저 안에서만 일어난다.
     · 비밀번호를 잊으면 복구 불가. (설계상 그래야 안전하다)
   방식: PBKDF2(20만회, SHA-256)로 키 유도 → AES-GCM 256으로 암복호화
   ══════════════════════════════════════════════════════════════════ */
let CKEY = null;      // 복호화 키 (메모리에만 · 새로고침하면 사라짐)
let CROWS = [];       // 복호화된 코멘트
const CSALT = new TextEncoder().encode('ipo-market-review-comment-v1');

async function cDeriveKey(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
      'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:CSALT, iterations:200000, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
function cB64(buf){ let s=''; const a=new Uint8Array(buf);
  for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }
function cUnB64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function cEnc(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key,
      new TextEncoder().encode(JSON.stringify(obj)));
  const out = new Uint8Array(12 + ct.byteLength);
  out.set(iv,0); out.set(new Uint8Array(ct),12);
  return cB64(out);
}
async function cDec(key, blob){
  const raw = cUnB64(blob);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(0,12)}, key, raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
/* 읽기: JSONP (Apps Script의 CORS 제약을 피하는 가장 확실한 방법) */
function cGet(){
  return new Promise(function(res, rej){
    const cb = 'cCB'+Date.now()+Math.floor(Math.random()*1000);
    const s = document.createElement('script');
    const to = setTimeout(function(){ cleanup(); rej(new Error('응답 시간 초과')); }, 15000);
    function cleanup(){ clearTimeout(to); delete window[cb]; if(s.parentNode) s.remove(); }
    window[cb] = function(d){ cleanup(); res(d); };
    s.onerror = function(){ cleanup(); rej(new Error('저장소에 연결하지 못했습니다')); };
    s.src = CAPI + (CAPI.indexOf('?')<0?'?':'&') + 'callback=' + cb + '&_=' + Date.now();
    document.body.appendChild(s);
  });
}
/* 쓰기: text/plain 본문 → 사전요청(preflight) 없이 전송. 응답은 읽지 않고, 다시 조회해 확인한다. */
async function cPost(payload){
  await fetch(CAPI, {method:'POST', mode:'no-cors', body: JSON.stringify(payload)});
}
function t4msg(html, isErr){
  const e=document.getElementById('t4msg');
  e.innerHTML = html ? '<div class="'+(isErr?'err':'note')+'">'+html+'</div>' : '';
}
async function t4open(){
  if(!CAPI){ t4msg('저장소가 아직 연결되지 않았습니다. 관리자에게 문의하세요.', 1); return; }
  const pw = (document.getElementById('t4pw')||{}).value || '';
  if(!pw){ t4msg('비밀번호를 입력하세요.', 1); return; }
  const btn=document.getElementById('t4go'); btn.disabled=true;
  t4msg('확인 중…');
  let key, data;
  try{ key = await cDeriveKey(pw); data = await cGet(); }
  catch(e){ t4msg('저장소에 연결하지 못했습니다. ('+e.message+')', 1); btn.disabled=false; return; }
  const rows = (data && data.rows) || [];
  const can = rows.filter(function(r){ return r.kind==='canary'; })[0];
  if(!can){
    if(!confirm('아직 비밀번호가 설정되지 않았습니다.\n지금 입력한 비밀번호로 설정할까요?\n\n※ 이 비밀번호를 잊으면 앞으로 쌓일 내용을 아무도 복구할 수 없습니다.')){
      t4msg(''); btn.disabled=false; return;
    }
    try{
      await cPost({kind:'canary', blob: await cEnc(key, {v:1, ok:'IPO-COMMENT'})});
      t4msg('비밀번호를 설정했습니다. 잠시 후 [열기]를 다시 눌러 주세요.');
    }catch(e){ t4msg('설정에 실패했습니다. ('+e.message+')', 1); }
    btn.disabled=false; return;
  }
  try{
    const v = await cDec(key, can.blob);
    if(v.ok !== 'IPO-COMMENT') throw new Error('bad');
  }catch(e){ t4msg('비밀번호가 올바르지 않습니다.', 1); btn.disabled=false; return; }
  CKEY = key;
  btn.disabled=false;
  await t4load(rows);
}
async function t4load(rows){
  if(!rows){ const d = await cGet(); rows = (d && d.rows) || []; }
  const out = [];
  for(const r of rows){
    if(r.kind !== 'note') continue;
    try{ const o = await cDec(CKEY, r.blob); o._ts = r.ts; out.push(o); }
    catch(e){ /* 다른 비번으로 쓴 글 — 건너뛴다 */ }
  }
  out.sort(function(a,b){ return String(b._ts||'').localeCompare(String(a._ts||'')); });
  CROWS = out;
  document.getElementById('t4gate').style.display='none';
  document.getElementById('t4body').style.display='';
  renderT4();
}

                                                        category:category, text:text})});
      msg.innerHTML='<div class="ok">저장했습니다. 목록을 새로 불러옵니다…</div>';
      setTimeout(async function(){ close(); await t4load(null); }, 900);
    }catch(e){
      msg.innerHTML='<div class="err">저장에 실패했습니다. ('+e.message+')</div>';
      sb.disabled=false; sb.textContent='저장';
    }
  };
  m.querySelector('#m_au').focus();
}
function t4download(){
  if(typeof XLSX==='undefined') return;
  const aoa=[["회사명","구분","작성자","작성일시","내용"]];
  CROWS.forEach(function(r){ aoa.push([r.company||'', r.category||'', r.author||'',
                                       fmtTs(r._ts), r.text||'']); });
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "심사코멘트");
  XLSX.writeFile(wb, "심사코멘트_"+isoAsof()+".xlsx");
}
/* ── 초기화 ──────────────────────────────────────────────────────────
   ★ 핵심 표(예심/공모·상장/분석)를 '가장 먼저' 그린다.
     한 부분(예: 심사코멘트 배선)에서 오류가 나도 표는 이미 떠 있도록,
     각 배선을 개별 try 로 감싸 서로를 무너뜨리지 않게 한다.
     — 과거: t4 배선이 renderT1 앞에 있어, 거기서 죽으면 표 전체가 빈 화면이 됐다. */
function _safe(label, fn){ try{ fn(); }catch(e){ console.error('[init] '+label+' 실패:', e); } }

_safe('renderT1', renderT1);
_safe('renderT2', renderT2);
_safe('renderT3', renderT3);
_safe('renderT6', renderT6);

_safe('탭 전환', function(){
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById(b.dataset.t).classList.add('active');
    };
  });
});
_safe('세그먼트', function(){
  document.querySelectorAll('.seg .segbtn').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('.seg .segbtn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); T2VIEW = b.dataset.v; renderT2();
    };
  });
});
_safe('프리셋/필터', function(){
  document.querySelectorAll('.preset').forEach(function(b){ b.onclick = function(){ applyPreset(b.dataset.tab, b.dataset.p); }; });
  document.getElementById('q').addEventListener('input', renderT1);
  ['t1from','t1to'].forEach(id=>document.getElementById(id).addEventListener('change', renderT1));
  ['t2from','t2to'].forEach(id=>document.getElementById(id).addEventListener('change', renderT2));
  ['t3from','t3to'].forEach(id=>document.getElementById(id).addEventListener('change', renderT3));
  document.getElementById('dl1').onclick = ()=>download('t1');
  document.getElementById('dl2').onclick = ()=>download('t2');
  document.getElementById('dl3').onclick = ()=>download('t3');
});
_safe('심사코멘트 배선', function(){
  document.getElementById('t4go').onclick = t4open;
  document.getElementById('t4pw').addEventListener('keydown', function(e){ if(e.key==='Enter') t4open(); });
  if(!CAPI){
    t4msg('저장소가 아직 연결되지 않았습니다. (Google 시트 설정 후 사용 가능)', 1);
    document.getElementById('t4go').disabled = true;
  }
});
